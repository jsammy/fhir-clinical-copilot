[project]
name = "fhir-clinical-copilot"
version = "0.1.0"
description = "Grounded clinical Q&A over HL7 FHIR R4 with resource-level citations (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
